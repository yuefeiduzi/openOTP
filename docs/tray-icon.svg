<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 18 18" width="18" height="18">
  <!--
    openOTP macOS menu bar template glyph, drawn on an 18x18 pt grid.

    A solid shield (same silhouette as docs/app-icon-v4.svg) with three knocked
    out dots. Six 1.25pt dots were tried first and read as a dotted line rather
    than as digits; three dots of 3.5pt (7px @2x, 40% larger) read as a code.

    Measured at 2x, this geometry leaves the outer dots 2px from the shield edge
    and 1px between dots. Wider dots (4pt) at this shield width touch or cut the
    silhouette — that is why the shield is 14.5pt wide and the dots 3.5pt.

    Only the alpha channel matters in a template image; the shapes are pure black
    on transparent. Rasterised 1:1 at 18pt / 36px @2x — never downscaled — which
    keeps the edges to a single anti-aliased pixel (5 alpha levels, 8% of pixels).
  -->
  <path
    fill="#000000"
    fill-rule="evenodd"
    d="
      M 9 0.75
      C 11.39 1.66 13.79 2.42 15.35 3.02
      C 15.8 3.32 16.25 3.91 16.25 5.01
      L 16.25 10
      C 16.25 13.2 14.15 15.4 9 16.75
      C 3.85 15.4 1.75 13.2 1.75 10
      L 1.75 5.01
      C 1.75 3.91 2.2 3.32 2.65 3.02
      C 4.21 2.42 6.61 1.66 9 0.75
      Z
      M 4.5 9.5  m -1.75 0 a 1.75 1.75 0 1 0 3.5 0 a 1.75 1.75 0 1 0 -3.5 0 Z
      M 9 9.5    m -1.75 0 a 1.75 1.75 0 1 0 3.5 0 a 1.75 1.75 0 1 0 -3.5 0 Z
      M 13.5 9.5 m -1.75 0 a 1.75 1.75 0 1 0 3.5 0 a 1.75 1.75 0 1 0 -3.5 0 Z
    "
  />
</svg>
