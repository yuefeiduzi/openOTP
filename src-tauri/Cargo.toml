[package]
name = "openotp"
version = "0.2.3"
description = "Open source, cross-platform, local-only two-factor authenticator"
authors = ["openOTP Team"]
license = "MIT"
repository = "https://github.com/yuefeiduzi/openOTP"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "openotp_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
pbkdf2 = { version = "0.12", features = ["sha2"] }
sha2 = "0.10"
rand = "0.8"
base64 = "0.22"
hex = "0.4"
subtle = "2"
# Backup container: standard zip, optionally AES-256 encrypted.
zip = { version = "8", default-features = false, features = ["aes-crypto", "deflate-flate2"] }

[target.'cfg(target_os = "macos")'.dependencies]
apple-localauthentication = "0.3"

[target.'cfg(target_os = "android")'.dependencies]
tauri-plugin-biometric = "2"
