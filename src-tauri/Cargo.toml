[package]
name = "openotp"
version = "0.1.0"
description = "Open source, cross-platform, local-only two-factor authenticator"
authors = ["openOTP Team"]
license = "MIT"
repository = "https://github.com/openotp/openotp"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "openotp_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.2", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
aes-gcm = "0.10"
pbkdf2 = { version = "0.12", features = ["sha2"] }
sha2 = "0.10"
rand = "0.8"
base64 = "0.22"
hex = "0.4"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"

[target.'cfg(target_os = "android")'.dependencies]
tauri-plugin-biometric = "2"
